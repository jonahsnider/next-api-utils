name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - parallel:
          - name: Generate docs
            run: pnpm run docs
          - name: Check formatting, lint, and types
            run: vp check
          - name: Test
            run: vp test run --coverage
          - name: Check unused code and dependencies
            run: vp exec knip
          - name: Build package
            run: vp pack
      - name: Validate API
        run: pnpm validate-api
