name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - parallel:
          - name: Generate docs
            run: pnpm run docs
          - name: Lint
            run: pnpm lint
          - name: Test
            run: pnpm test:coverage
          - name: Build package
            run: pnpm build
      - name: Validate API
        run: pnpm validate-api
